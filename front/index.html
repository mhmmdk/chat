<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FunChat — Modern Light Chat</title>

    <!-- Fonts & icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="./main.css" rel="stylesheet" />

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.254.0/dist/lucide.min.js"></script>
  </head>

  <body>
    <div class="wrap">
      <div class="app" role="application" aria-label="Chat application">
        <!-- Sidebar -->
        <aside class="sidebar hide" aria-label="Conversations">
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
            "
          >
            <div class="brand">
              <div class="logo">FC</div>
              <div>
                <h1>FunChat</h1>
                <p>Light • Fast • Friendly</p>
              </div>
            </div>
            <div>
              <button
                class="icon-btn"
                title="Collapse"
                onclick="toggleSidebar()"
                id="x"
                aria-label="Toggle side"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M6 6l12 12M18 6l-12 12"
                    stroke="#374151"
                    stroke-width="1.4"
                    stroke-linecap="round"
                  />
                </svg>
              </button>
            </div>
          </div>

          <div
            style="
              display: flex;
              gap: 10px;
              align-items: center;
              margin-top: 8px;
            "
          >
            <div class="search" style="flex: 1">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                style="opacity: 0.7"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M11 4a7 7 0 1 1 0 14a7 7 0 0 1 0-14zM21 21l-4.35-4.35"
                  stroke="#6b7280"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>

              <input
                id="search"
                placeholder="Search"
                aria-label="Search conversations"
              />
            </div>
            <button
              class="icon-btn"
              title="New conversation"
              aria-label="New conversation"
              onclick="newConv()"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path
                  d="M12 5v14M5 12h14"
                  stroke="#374151"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>

          <div class="conversations" id="conversations">
            <!-- conversation items appended here -->
          </div>

          <div style="margin-top: auto; font-size: 13px; color: var(--muted)">
            <p style="margin: 0 0 8px 0">
              Pro Tip: Press <strong>Enter</strong> to send
            </p>
            <small>Built with ChatGPT • Dev: Mohammed Kassahun</small>
          </div>
        </aside>

        <!-- Chat area -->
        <main id="chat" class="chat-area" aria-live="polite">
          <div class="topbar">
            <div class="top-left">
              <div class="logo">AI</div>
              <div>
                <div class="chat-title">Open Assistant</div>
                <div class="chat-sub">Online • Built for fun</div>
              </div>
            </div>

            <div class="top-left">
              <button
                class="icon-btn"
                title="Theme (light)"
                onclick="toggleTheme()"
                id="themeBtn"
                aria-label="Toggle theme"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
                    stroke="#374151"
                    stroke-width="1.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
              <button
                class="icon-btn"
                title="Side (left)"
                onclick="toggleSidebar()"
                id="expand"
                aria-label="Toggle side"
              >
                <svg
                  id="menuIcon"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                >
                  <path
                    d="M4 6h16M4 12h16M4 18h16"
                    stroke="#374151"
                    stroke-width="1.4"
                    stroke-linecap="round"
                  />
                </svg>

                <svg
                  id="closeIcon"
                  style="display: none"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                >
                  <path
                    d="M6 6l12 12M18 6l-12 12"
                    stroke="#374151"
                    stroke-width="1.4"
                    stroke-linecap="round"
                  />
                </svg>
              </button>
              <button
                class="icon-btn"
                title="Settings"
                aria-label="Settings"
                onclick="setting()"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path
                    d="M19.14 12.94a7.97 7.97 0 0 0 0-1.88l2.03-1.58a0.5 0.5 0 0 0 .12-0.61l-1.92-3.32a0.5 0.5 0 0 0-0.6-0.22l-2.39 0.96a7.97 7.97 0 0 0-1.6-0.94L14.5 2.5a0.5 0.5 0 0 0-0.5-0.38h-3.98a0.5 0.5 0 0 0-0.5 0.38L9.22 4.5a7.97 7.97 0 0 0-1.6 0.94L5.23 4.48a0.5 0.5 0 0 0-0.57 0.22L2.74 8.02a0.5 0.5 0 0 0 .12 0.61l2.03 1.58a7.97 7.97 0 0 0 0 1.88L2.88 14.1a0.5 0.5 0 0 0-.12 0.61l1.92 3.32c0.11 0.2 0.35 0.3 0.57 0.22l2.39-0.96c0.5 0.38 1.02 0.7 1.6 0.94l0.64 1.78c0.05 0.22 0.25 0.38 0.5 0.38h3.98c0.25 0 0.45-0.16 0.5-0.38l0.64-1.78c0.58-0.24 1.1-0.56 1.6-0.94l2.39 0.96c0.22 0.09 0.46-0.02 0.57-0.22l1.92-3.32a0.5 0.5 0 0 0-.12-0.61l-2.03-1.58z"
                    stroke="#374151"
                    stroke-width="1.2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    fill="none"
                  />
                  <circle
                    cx="12"
                    cy="12"
                    r="3.5"
                    stroke="#374151"
                    stroke-width="1.4"
                    fill="none"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>
          </div>

          <div class="messages" id="messages" role="log" aria-live="polite">
            <!-- default message -->
            <div class="msg you" id="welcome">
              <div class="avatar logo">A</div>
              <div>
                <div class="bubble you">
                  Hello! I'm your friendly assistant. Try sending a message —
                  press Enter or click Send.
                </div>
                <div class="meta-right">09:00</div>
              </div>
            </div>
          </div>

          <div class="input-wrap">
            <div class="field" role="group" aria-label="Message input">
              <button
                class="icon-btn"
                title="Attach"
                onclick="alert('Attach not implemented')"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M21.44 11.05l-8.49 8.49a5 5 0 1 1-7.07-7.07l8.49-8.49a3.5 3.5 0 0 1 4.95 4.95l-8.49 8.49a1.5 1.5 0 0 1-2.12-2.12l7.78-7.78"
                    stroke="#374151"
                    stroke-width="1.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
              <input
                id="msgInput"
                placeholder="Write a message..."
                aria-label="Message input"
              />
              <button class="icon-btn" title="Emoji" onclick="toggleEmoji()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"
                    stroke="#374151"
                    stroke-width="1.2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M8 14s1.5 2 4 2 4-2 4-2"
                    stroke="#374151"
                    stroke-width="1.2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M9 9h.01M15 9h.01"
                    stroke="#374151"
                    stroke-width="1.2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>

            <button
              class="btn"
              id="sendBtn"
              onclick="sendMessage()"
              aria-label="Send message"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                style="transform: rotate(45deg)"
              >
                <path
                  d="M22 2L11 13"
                  stroke="white"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M22 2l-7 20-4-9-9-4 20-7z"
                  stroke="white"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span>Send</span>
            </button>
          </div>
        </main>
      </div>
    </div>
    <script src="./main.js"></script>
  </body>
</html>
